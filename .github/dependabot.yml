version: 2
updates:
  - package-ecosystem: pip
    directory: "/packages/python"
    schedule:
      interval: weekly
    groups:
      python-patch-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-patch-minor:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]
